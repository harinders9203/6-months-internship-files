<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encryption & Decryption Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .radio-group {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="radio"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: #667eea;
        }

        .radio-option label {
            margin-bottom: 0;
            font-weight: 500;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .result-box {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
        }

        .result-item {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .result-item h3 {
            color: #667eea;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-item p {
            color: #333;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            background: white;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Encryption Tool</h1>
        <p class="subtitle">Securely encrypt or decrypt your messages</p>

        <form action="/msg" method="post">
            <div class="form-group">
                <label for="msg">Message</label>
                <input type="text" name="msg" id="msg" placeholder="Enter your message" required>
            </div>

            <div class="form-group">
                <label for="key">Encryption Key</label>
                <input type="text" name="key" id="key" placeholder="Enter your encryption key" required>
            </div>

            <div class="form-group">
                <label>Operation</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" name="choice" id="enc" value="enc" required>
                        <label for="enc">Encrypt</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" name="choice" id="dec" value="dec" required>
                        <label for="dec">Decrypt</label>
                    </div>
                </div>
            </div>

            <button type="submit">Process</button>
        </form>

        {% if encrypted %}
            <div class="result-box">
                <div class="result-item">
                    <h3>✓ Encrypted Message</h3>
                    <p>{{encrypted}}</p>
                </div>
            </div>
        {% endif %}

        {% if decrypted %}
            <div class="result-box">
                <div class="result-item">
                    <h3>✓ Decrypted Message</h3>
                    <p>{{decrypted}}</p>
                </div>
            </div>
        {% endif %}
    </div>
</body>
</html>
